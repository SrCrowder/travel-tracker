# ─── Persistent storage ───────────────────────────────────────────────────────
# All data lives in ./docker-data/ so it survives container rebuilds.
# Delete that folder to start fresh (wipes database + uploaded photos).

services:

  # ── API (Node + Express + SQLite) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel-tracker-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./docker-data/db:/app/data        # SQLite file
      - ./docker-data/uploads:/app/uploads # Uploaded images
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: http://localhost:5173
      # Optional: require a login (username/password) to use the app
      # WEB_USER: admin
      # WEB_PASSWORD: change-me
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend (React built by Vite, served by nginx) ───────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The browser calls this URL directly, so it must be reachable
        # from the HOST machine — localhost:3001 is correct when backend
        # port 3001 is exposed above.
        VITE_API_URL: ""
    container_name: travel-tracker-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
