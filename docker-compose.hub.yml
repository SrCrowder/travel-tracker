# ─── Travel Tracker — pre-built images from GitHub (ghcr.io) ──────────────────
#
# Usage:
#   docker compose -f docker-compose.hub.yml pull
#   docker compose -f docker-compose.hub.yml up -d
#
# Images are built and published by GitHub Actions on every push to main
# (.github/workflows/ghcr.yml). Pin a version with :AAAA.MM.DD or :sha-xxxxxxx
# instead of :latest if you want to control updates.
#
# The frontend uses relative URLs — nginx proxies /api/ and /uploads/ to the
# backend internally, so this works on any IP or domain without rebuilding.
#
# Data persists in /mnt/nvme/apps/travel-tracker/ on the host.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── API (Node + Express + SQLite) ─────────────────────────────────────────
  backend:
    image: ghcr.io/srcrowder/travel-tracker-backend:latest
    container_name: travel-tracker-api
    restart: unless-stopped
    # No published port: the frontend's nginx reaches the API over the internal
    # Docker network (http://backend:3001). Uncomment only to debug the API.
    # ports:
    #   - "3001:3001"
    volumes:
      - /mnt/nvme/apps/travel-tracker/ddbb:/app/data
      - /mnt/nvme/apps/travel-tracker/uploads:/app/uploads
    environment:
      NODE_ENV: production
      PORT: 3001
      # Optional: require a login (username/password) to use the app
      # WEB_USER: admin
      # WEB_PASSWORD: change-me
      # Without login, list the host names you use to reach the app (blocks DNS rebinding):
      # ALLOWED_HOSTS: travel.example.com,192.168.1.10:5173
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          # Converting iPhone 4K videos (ffmpeg) needs headroom
          memory: 2g

  # ── Frontend (React + nginx) ───────────────────────────────────────────────
  frontend:
    image: ghcr.io/srcrowder/travel-tracker-frontend:latest
    container_name: travel-tracker-ui
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
