# Construye las dos imágenes y las publica en GitHub Container Registry:
#   ghcr.io/srcrowder/travel-tracker-backend
#   ghcr.io/srcrowder/travel-tracker-frontend
#
# - push a main        -> :latest, :AAAA.MM.DD y :sha-<commit>
# - tag vX.Y.Z         -> :X.Y.Z y :X.Y
# - manual             -> pestaña Actions -> "Publicar imagen en ghcr.io" -> Run workflow
name: Publicar imagen en ghcr.io

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "README.md"
      - "DOCUMENTATION.md"
      - ".env.example"
      - "docker-compose*.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            description: API REST de Travel Tracker (Node + Express + SQLite)
          - component: frontend
            description: Interfaz web de Travel Tracker (React servido por nginx)
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/srcrowder/travel-tracker-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYY.MM.DD' tz='Europe/Madrid'}},enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=travel-tracker-${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}

      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max
